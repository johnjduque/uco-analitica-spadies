# ===================================================================
# Despliegue en servidor: SQL Server + aplicación + proxy HTTPS (Caddy)
#
#   1. cp deploy/env.produccion.example .env   y complete los valores
#   2. docker compose up -d --build
#   3. Abra https://<DOMINIO>
#
# Los secretos se leen del archivo .env (nunca se escriben aquí).
# ===================================================================
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env}
    volumes:
      - mssql_data:/var/opt/mssql
    # Sin puertos publicados: la base solo es accesible desde la red interna de Docker.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: produccion
      DB_ENGINE: sqlserver
      SQLSERVER_HOST: db
      SQLSERVER_PORT: "1433"
      SQLSERVER_TRUST_CERT: "yes"   # certificado autofirmado del contenedor de SQL Server
    volumes:
      - app_data:/data
    expose:
      - "8000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mssql_data:
  app_data:
  caddy_data:
  caddy_config:
