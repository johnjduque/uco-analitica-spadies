version: '3.8'

services:
  # Base de Datos Relacional Empresarial: Microsoft SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: uco_sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "UcoAnalytics2026*SecurePass!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'UcoAnalytics2026*SecurePass!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend FastAPI con Clean Architecture y Frontend SPA Servido
  uco-analytics-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uco_analytics_api
    restart: always
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_ENGINE: "sqlserver"
      SQLSERVER_HOST: "sqlserver"
      SQLSERVER_PORT: "1433"
      SQLSERVER_DATABASE: "UCO_Analytics"
      SQLSERVER_USER: "sa"
      SQLSERVER_PASSWORD: "UcoAnalytics2026*SecurePass!"
      SQLSERVER_DRIVER: "ODBC Driver 18 for SQL Server"
      SECRET_KEY: "uco_jwt_super_secret_key_production_2026_89f3a1e7b24c9"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      AUTH_MODE: "LOCAL"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/user_uploads:/app/backend/user_uploads

volumes:
  mssql_data:
    driver: local
